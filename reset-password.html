<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ | JOKJUNG POS</title>
<link rel="stylesheet" href="./css/login.css">
<script type="module" src="./js/reset-password.js?v=2.9.4"></script>
</head>
<body>
<div class="login-box">
<h1>JOKJUNG POS</h1>
<p>ตั้งรหัสผ่านใหม่</p>
<input type="password" id="newPassword" placeholder="รหัสผ่านใหม่" autocomplete="new-password">
<input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่" autocomplete="new-password">
<button id="savePasswordBtn">บันทึกรหัสผ่านใหม่</button>
<button id="backLoginBtn" type="button" style="margin-top:10px;background:transparent;border:0;color:#8a6a00;cursor:pointer;text-decoration:underline;">กลับหน้าเข้าสู่ระบบ</button>
<p id="message"></p>
</div>
</body>
</html>
